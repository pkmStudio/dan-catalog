# Stable browser/SSR -> Nitro BFF contract. Upstream backend DTOs are validated
# and mapped server-side and may use different paths or field names.
openapi: 3.1.0
info:
  title: DAN Catalog BFF Contract
  version: 2.0.0
  description: >
    Same-origin contract consumed by the Nuxt application. Categories are flat,
    nomenclatures are keyed by part_number, and applicability unknown states are
    safe local projections rather than authoritative backend facts.
servers:
  - url: /api
    description: Nitro BFF
tags:
  - name: Catalog
  - name: Vehicles
  - name: Content
  - name: Inquiries

paths:
  /catalog/categories:
    get:
      tags: [Catalog]
      operationId: getCategories
      summary: List flat catalog categories
      responses:
        '200':
          description: Flat categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        default:
          $ref: '#/components/responses/ApiError'

  /catalog/categories/{categorySlug}/nomenclatures:
    get:
      tags: [Catalog]
      operationId: getCategoryNomenclatures
      summary: Get a filtered page of category nomenclatures and facets
      parameters:
        - $ref: '#/components/parameters/CategorySlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: filter
          in: query
          description: Repeated category filter token in key:value form
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - $ref: '#/components/parameters/VehicleModificationIdOptional'
      responses:
        '200':
          description: Nomenclature page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NomenclaturePageResponse'
        '404':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'

  /catalog/nomenclatures/{part_number}:
    get:
      tags: [Catalog]
      operationId: getNomenclature
      summary: Get nomenclature detail by part number
      parameters:
        - $ref: '#/components/parameters/PartNumber'
      responses:
        '200':
          description: Nomenclature detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NomenclatureResponse'
        '404':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'

  /catalog/search:
    get:
      tags: [Catalog]
      operationId: searchNomenclatures
      summary: Search nomenclatures by part_number or name
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
      responses:
        '200':
          description: Search outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'

  /vehicles/manufacturers:
    get:
      tags: [Vehicles]
      operationId: getVehicleManufacturers
      summary: List manufacturers with allowed vehicles
      responses:
        '200':
          description: Ordered manufacturers with at least one allowed vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleManufacturerListResponse'
        default:
          $ref: '#/components/responses/ApiError'

  /vehicles/manufacturers/{manufacturerId}/vehicles:
    get:
      tags: [Vehicles]
      operationId: getManufacturerVehicles
      summary: List allowed vehicles for a manufacturer
      parameters:
        - $ref: '#/components/parameters/ManufacturerId'
      responses:
        '200':
          description: Ordered allowed vehicles for the manufacturer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogVehicleListResponse'
        '404':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'

  /vehicles/{vehicleId}/modifications:
    get:
      tags: [Vehicles]
      operationId: getVehicleModifications
      summary: List modifications for an allowed vehicle
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Modifications for an allowed vehicle, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleModificationListResponse'
        '404':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'

  /vehicles/modifications/{modificationId}:
    get:
      tags: [Vehicles]
      operationId: getVehicleModificationContext
      summary: Get the full context of an allowed vehicle modification
      parameters:
        - $ref: '#/components/parameters/ModificationId'
      responses:
        '200':
          description: Manufacturer, vehicle and modification context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleModificationContextResponse'
        '404':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'

  /catalog/nomenclatures/{part_number}/applicability:
    get:
      tags: [Catalog, Vehicles]
      operationId: getNomenclatureApplicability
      summary: Resolve nomenclature applicability for a vehicle modification
      description: >
        Only explicit upstream compatible/incompatible facts are conclusive.
        The BFF may return unknown when no relation exists. Transport or invalid
        upstream responses are returned as errors and the UI projects them to a
        retryable unknown state.
      parameters:
        - $ref: '#/components/parameters/PartNumber'
        - $ref: '#/components/parameters/VehicleModificationIdRequired'
      responses:
        '200':
          description: Applicability result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicabilityResponse'
        '404':
          description: Unknown nomenclature or modification, not a missing relation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        default:
          $ref: '#/components/responses/ApiError'

  /content/about:
    get:
      tags: [Content]
      operationId: getAboutContent
      summary: Get approved company content
      responses:
        '200':
          description: About content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutResponse'
        default:
          $ref: '#/components/responses/ApiError'

  /content/contacts:
    get:
      tags: [Content]
      operationId: getContactContent
      summary: Get company contacts
      responses:
        '200':
          description: Contact content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        default:
          $ref: '#/components/responses/ApiError'

  /inquiries:
    post:
      tags: [Inquiries]
      operationId: createInquiry
      summary: Submit a general or nomenclature inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryRequest'
      responses:
        '201':
          description: Inquiry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryAcceptedResponse'
        '422':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'

components:
  parameters:
    CategorySlug:
      name: categorySlug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PartNumber:
      name: part_number
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ManufacturerId:
      name: manufacturerId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ModificationId:
      name: modificationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    VehicleModificationIdOptional:
      name: vehicleModificationId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    VehicleModificationIdRequired:
      name: vehicleModificationId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum: [9]
        default: 9

  responses:
    ApiError:
      description: Normalized safe error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    SeoDocument:
      type: object
      additionalProperties: false
      required: [title, description, canonicalPath]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        canonicalPath: { type: string, pattern: '^/' }

    Category:
      type: object
      additionalProperties: false
      required: [id, slug, name, description, image, sortOrder, nomenclatureCount]
      properties:
        id: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        description: { type: string }
        image: { type: string, minLength: 1 }
        sortOrder: { type: integer, minimum: 0 }
        nomenclatureCount: { type: integer, minimum: 0 }

    CategoryListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    NomenclatureSummary:
      type: object
      required: [part_number, name, image]
      properties:
        part_number: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        image: { type: string, minLength: 1 }

    NomenclatureImage:
      type: object
      additionalProperties: false
      required: [src, alt, sortOrder]
      properties:
        src: { type: string, minLength: 1 }
        alt: { type: string }
        thumbnailSrc: { type: string }
        sortOrder: { type: integer, minimum: 0 }

    NomenclatureSpecification:
      type: object
      additionalProperties: false
      required: [key, label, value, filterable]
      properties:
        key: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        value:
          oneOf:
            - type: string
            - type: number
        unit: { type: string }
        filterable: { type: boolean }

    NomenclatureAnalog:
      type: object
      additionalProperties: false
      required: [part_number, name]
      properties:
        part_number: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        linked_part_number: { type: string, minLength: 1 }
        manufacturer: { type: string }

    ApplicationEvidence:
      type: object
      additionalProperties: false
      required: [modificationId, label]
      properties:
        modificationId: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }

    Nomenclature:
      allOf:
        - $ref: '#/components/schemas/NomenclatureSummary'
        - type: object
          required:
            - categoryId
            - description
            - images
            - specifications
            - oemNumbers
            - analogs
            - applications
            - seo
          properties:
            categoryId: { type: string, minLength: 1 }
            description: { type: string, minLength: 1 }
            images:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/NomenclatureImage'
            specifications:
              type: array
              items:
                $ref: '#/components/schemas/NomenclatureSpecification'
            oemNumbers:
              type: array
              items: { type: string }
            analogs:
              type: array
              items:
                $ref: '#/components/schemas/NomenclatureAnalog'
            applications:
              type: array
              items:
                $ref: '#/components/schemas/ApplicationEvidence'
            seo:
              $ref: '#/components/schemas/SeoDocument'

    NomenclatureResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Nomenclature'

    FilterOption:
      type: object
      additionalProperties: false
      required: [value, label, count]
      properties:
        value: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        count: { type: integer, minimum: 0 }

    FilterFacet:
      type: object
      additionalProperties: false
      required: [key, label, kind, options]
      properties:
        key: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        kind: { type: string, enum: [enum, number] }
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FilterOption'

    NomenclaturePage:
      type: object
      additionalProperties: false
      required: [category, items, total, page, pageSize, pageCount, facets]
      properties:
        category:
          $ref: '#/components/schemas/Category'
        items:
          type: array
          items:
            $ref: '#/components/schemas/NomenclatureSummary'
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, enum: [9] }
        pageCount: { type: integer, minimum: 0 }
        facets:
          type: array
          items:
            $ref: '#/components/schemas/FilterFacet'

    NomenclaturePageResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/NomenclaturePage'

    SearchResult:
      type: object
      additionalProperties: false
      required: [match, items]
      properties:
        match: { type: string, enum: [exact, multiple, empty] }
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/NomenclatureSummary'

    SearchResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SearchResult'

    VehicleManufacturer:
      type: object
      additionalProperties: false
      required: [id, mfaId, name]
      properties:
        id: { type: integer, minimum: 1 }
        mfaId: { type: integer }
        name: { type: string, minLength: 1 }

    VehicleManufacturerListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VehicleManufacturer'

    CatalogVehicle:
      type: object
      additionalProperties: false
      required:
        - id
        - msId
        - manufacturerId
        - name
        - localizedName
        - generation
        - generationShort
        - carcase
        - yearFrom
        - yearTo
      properties:
        id: { type: integer, minimum: 1 }
        msId: { type: integer }
        manufacturerId: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1 }
        localizedName: { type: [string, 'null'], minLength: 1 }
        generation: { type: [string, 'null'], minLength: 1 }
        generationShort: { type: [string, 'null'], minLength: 1 }
        carcase: { type: string, minLength: 1 }
        yearFrom: { type: [integer, 'null'] }
        yearTo: { type: [integer, 'null'] }

    CatalogVehicleListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogVehicle'

    VehicleModification:
      type: object
      additionalProperties: false
      required:
        - id
        - modId
        - vehicleId
        - msId
        - yearFrom
        - yearTo
        - description
        - powerPs
        - powerKw
        - engineType
        - gearType
        - driveType
        - brakeSystemType
        - numberOfCylinders
        - capacityLt
      properties:
        id: { type: integer, minimum: 1 }
        modId: { type: integer }
        vehicleId: { type: integer, minimum: 1 }
        msId: { type: integer }
        yearFrom: { type: [integer, 'null'] }
        yearTo: { type: [integer, 'null'] }
        description: { type: [string, 'null'], minLength: 1 }
        powerPs: { type: [integer, 'null'], minimum: 0 }
        powerKw: { type: [integer, 'null'], minimum: 0 }
        engineType: { type: [string, 'null'], minLength: 1 }
        gearType: { type: [string, 'null'], minLength: 1 }
        driveType: { type: [string, 'null'], minLength: 1 }
        brakeSystemType: { type: [string, 'null'], minLength: 1 }
        numberOfCylinders: { type: [integer, 'null'], minimum: 1 }
        capacityLt: { type: [number, 'null'], minimum: 0 }

    VehicleModificationListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VehicleModification'

    VehicleModificationContext:
      type: object
      additionalProperties: false
      required: [manufacturer, vehicle, modification]
      properties:
        manufacturer:
          $ref: '#/components/schemas/VehicleManufacturer'
        vehicle:
          $ref: '#/components/schemas/CatalogVehicle'
        modification:
          $ref: '#/components/schemas/VehicleModification'

    VehicleModificationContextResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/VehicleModificationContext'

    ApplicabilityResult:
      type: object
      additionalProperties: false
      required: [part_number, modificationId, status, message, evidence, retryable]
      properties:
        part_number: { type: string, minLength: 1 }
        modificationId: { type: string, minLength: 1 }
        status: { type: string, enum: [compatible, incompatible, unknown] }
        reason: { type: string, enum: [no_data, temporarily_unavailable, invalid_response] }
        message: { type: string, minLength: 1 }
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationEvidence'
        retryable: { type: boolean }
      allOf:
        - if:
            properties:
              status: { const: unknown }
          then:
            required: [reason]

    ApplicabilityResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ApplicabilityResult'

    AboutContent:
      type: object
      additionalProperties: false
      required: [heading, lead, sections, seo]
      properties:
        heading: { type: string, minLength: 1 }
        lead: { type: string, minLength: 1 }
        sections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [heading, body]
            properties:
              heading: { type: string, minLength: 1 }
              body: { type: string, minLength: 1 }
        seo:
          $ref: '#/components/schemas/SeoDocument'

    AboutResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AboutContent'

    ContactContent:
      type: object
      additionalProperties: false
      required: [phone, email, address, workingHours, supportNote, seo]
      properties:
        phone: { type: string, minLength: 1 }
        email: { type: string, format: email }
        address: { type: string, minLength: 1 }
        workingHours: { type: string, minLength: 1 }
        supportNote: { type: string, minLength: 1 }
        seo:
          $ref: '#/components/schemas/SeoDocument'

    ContactResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ContactContent'

    InquiryRequest:
      type: object
      additionalProperties: false
      required: [type, name, phone, message, consent]
      properties:
        type: { type: string, enum: [general, product] }
        part_number: { type: string, minLength: 1 }
        name:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[\p{L}\s-]+$'
        phone: { type: string, pattern: '^\+7\d{10}$' }
        email: { type: string, format: email }
        message: { type: string, minLength: 10, maxLength: 1000 }
        consent: { const: true }
      allOf:
        - if:
            properties:
              type: { const: product }
          then:
            required: [part_number]

    InquiryAccepted:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: string, minLength: 1 }
        status: { const: accepted }

    InquiryAcceptedResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/InquiryAccepted'

    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
        requestId: { type: string }

    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
